name: Build TrueDepth Probe (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate and build
        run: |
          ls -d /Applications/Xcode*.app
          XCODE_PATH=$(python3 -c 'import glob,re; paths=glob.glob("/Applications/Xcode_26*.app"); print(sorted(paths, key=lambda p: tuple(map(int,re.search(r"Xcode_([0-9.]+)",p).group(1).strip(".").split("."))))[0])')
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodegen --version
          cd apps/ios
          xcodegen generate
          # A fresh runner can lose XCBBuildService on its first invocation.
          for attempt in 1 2 3; do
            if xcodebuild -project TrueDepthProbe.xcodeproj -scheme TrueDepthProbe -configuration Release -sdk iphoneos -derivedDataPath ../../build -jobs 1 CODE_SIGNING_ALLOWED=NO build; then
              exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/TrueDepthProbe.app dist/Payload/
          cd dist
          zip -qr TrueDepthProbe-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: TrueDepthProbe-unsigned
          path: dist/TrueDepthProbe-unsigned.ipa
          retention-days: 7
